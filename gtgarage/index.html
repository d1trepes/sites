<style>
:root{--f-head:"Unbounded",system-ui,sans-serif;--f-body:"Onest",system-ui,sans-serif;--r:24px;--r-sm:16px;--wrap:1240px;--gut:16px;--ease:cubic-bezier(.2,.7,.2,1);

html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;color-scheme:dark}
body{background:var(--bg);color:var(--tx);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* кнопки */

.btn{transition:transform .2s,background-color .25s,color .25s,box-shadow .25s}

/* что ещё делаем */
.svc{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sv{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;grid-template-columns:1fr 200px;grid-template-rows:auto 1fr;gap:16px 20px;align-items:start;overflow:hidden;transition:border-color .3s}
.sv:hover{border-color:var(--mut)}
.sv .pic{grid-column:2;grid-row:1/3;display:grid;place-items:center;border-radius:var(--r-sm)}
.sv .pic img{max-height:190px;max-width:100%;object-fit:contain}
.sv h3{font-size:21px;line-height:1.2;grid-column:1/-1;white-space:nowrap}
.sv .pic{grid-row:2/3!important}
.sv .chips{grid-column:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chips span{border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:14.5px;line-height:1.2}
@media(max-width:960px){.svc{grid-template-columns:1fr}}
@media(max-width:560px){.sv{grid-template-columns:1fr;padding:22px}.sv h3{white-space:normal}.sv .pic{grid-column:1;grid-row:1!important;height:150px}.sv .pic img{max-height:140px}}

/* почему мы */
.why{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.why>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column}
.why .ic{width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;color:var(--ac);margin-bottom:22px;flex:none}
.why .ic svg{width:24px;height:24px}
.why h3{font-size:22px;line-height:1.15;margin-bottom:12px}
.why p{font-size:16px;line-height:1.45;color:var(--mut)}
.why .brands{display:grid;grid-template-columns:1fr minmax(160px,46%);align-items:center;gap:20px}
.why .brands small{display:block;font:600 13px var(--f-body);color:var(--ac-tx);margin-bottom:12px;letter-spacing:.06em;text-transform:uppercase}
.why .brands h3{font-size:clamp(18px,1.5vw,21px);line-height:1.35;margin:0}
.why .brands img{width:100%;height:auto;object-fit:contain}
@media(max-width:960px){.why{grid-template-columns:1fr 1fr}.why .brands{grid-column:1/-1}}
@media(max-width:560px){.why{grid-template-columns:1fr}.why>div{padding:22px}.why .brands{grid-template-columns:1fr}.why .brands img{width:78%;margin:0 auto}}

/* как записаться */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:s}
.step{position:relative;padding:28px 0 0;border-top:1px solid var(--line)}
.step::before{content:"";position:absolute;left:0;top:-1px;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease)}
.step.in::before{transform:none}
.step:nth-child(2)::before{transition-delay:.25s}.step:nth-child(3)::before{transition-delay:.5s}
.step i{counter-increment:s;font:600 15px var(--f-body);color:var(--ac-tx);font-style:normal}
.step i::before{content:"0" counter(s)}
.step h3{font-size:clamp(20px,2vw,26px);margin:14px 0 10px}
.step p{color:var(--mut);max-width:30ch}
.steps-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
@media(max-width:760px){.steps{grid-template-columns:1fr;gap:28px}}

/* контакты */
.cnt{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}
.info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;display:flex;flex-direction:column;gap:24px}
.info dt{color:var(--mut);font-size:14px;margin-bottom:6px}
.info dd{font-size:18px;font-weight:500}
.info dd a{border-bottom:1px solid var(--line)}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:4px 20px}
.info .btn{margin-top:auto;align-self:flex-start}
.map{position:relative;border-radius:var(--r);overflow:hidden;min-height:440px;background:var(--card);border:1px solid var(--line)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .6s}
.map.ok iframe{opacity:1}
.map .ph{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;color:var(--mut);font-size:15px;background:repeating-linear-gradient(135deg,var(--card) 0 14px,var(--card2) 14px 15px)}
.map .ph .pin{width:36px;height:36px}
.map .cover{position:absolute;inset:0;z-index:2;display:none;align-items:flex-end;justify-content:center;padding:16px}
.map .cover span{background:rgba(0,0,0,.7);color:#fff;font-size:14px;padding:9px 16px;border-radius:99px}
@media(hover:none){.map.ok .cover{display:flex}}
@media(max-width:860px){.cnt{grid-template-columns:1fr}.map{min-height:340px}}

/* призыв */
.cta{position:relative;background:var(--ac);color:var(--on-ac);border-radius:calc(var(--r) + 8px);padding:clamp(32px,6vw,72px);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:24px;overflow:hidden}
.cta h2{margin:0 0 20px;font-size:clamp(30px,4.8vw,62px)}
.cta .tel{display:inline-block;font:700 clamp(24px,3.6vw,46px)/1 var(--f-head);letter-spacing:-.03em;margin-bottom:28px}
.cta .row{display:flex;flex-wrap:wrap;gap:12px}
.cta .btn{--bd:var(--on-ac);color:inherit;--fill:var(--on-ac)}.cta .btn.inv{background:var(--on-ac);color:var(--ac);--bd:transparent;--fill:#0b0b0c}
.cta .tools{position:relative;justify-self:center;width:min(100%,420px)}
.cta .tools img{position:relative;z-index:1;width:100%;transform:rotate(-4deg);pointer-events:none;filter:drop-shadow(0 22px 26px rgba(0,0,0,.4))}
@media(max-width:860px){.cta{grid-template-columns:1fr}.cta .tools{width:70%;order:-1;margin-bottom:-8px}}

/* подвал */
.ftr{background:var(--bg2);border-top:1px solid var(--line);font-size:15px}
.ftr .top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding:56px 0 44px}
.ftr h4{font:500 13px var(--f-body);color:var(--mut);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.ftr li{list-style:none;margin-bottom:9px}
.ftr li button{text-align:left;padding:0;font-size:inherit;line-height:inherit}
.ftr li a,.ftr li button{transition:color .2s}.ftr li a:hover,.ftr li button:hover{color:var(--ac-tx)}
.ftr .brand .logo{font-size:24px;display:block;margin-bottom:12px}
.ftr .brand p{color:var(--mut);max-width:30ch}
.ftr .brand .stars{margin-top:16px}
.ftr .brand small{display:block;color:var(--mut);margin-top:4px}
.ftr .bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding:20px 0 28px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
@media(max-width:860px){.ftr .top{grid-template-columns:1fr 1fr}.ftr .brand{grid-column:1/-1}}
.demo{background:var(--bg);color:var(--mut);text-align:center;font-size:13px;padding:14px var(--gut);border-top:1px solid var(--line)}

/* политика */
dialog{position:fixed;inset:0;margin:auto;width:min(720px,calc(100% - 24px));max-width:none;height:min(86dvh,860px);max-height:none;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--tx);padding:0;overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog .d-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px 28px;border-bottom:1px solid var(--line);flex:none}
dialog .d-top b{font:700 18px var(--f-head)}
dialog .x{width:40px;height:40px;border-radius:50%;background:var(--card2);font-size:22px;line-height:1;flex:none}
dialog .in-d{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:8px 28px 32px;overflow-wrap:anywhere}
dialog h3{font:600 17px var(--f-body);margin:22px 0 8px}
dialog p,dialog li{color:var(--mut);font-size:15px;margin-bottom:8px}
dialog ul{padding-left:20px}
@media(max-width:640px){dialog{width:100%;height:92dvh;margin:auto 0 0;border-radius:var(--r) var(--r) 0 0;border-bottom:0}dialog .in-d{padding:4px 20px 28px}dialog .d-top{padding:16px 16px 12px 20px}}

/* телефон */
@media(max-width:640px){
  section{padding:48px 0}
  h2{margin-bottom:24px}
  main .btn{width:100%}
  .hero{padding:84px 0 44px}
  .cta .row{flex-direction:column}
  .info .btn{align-self:stretch}
}

/* лёгкое появление */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.step::before{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><h1>GTgarage — ремонт двигателей, АКПП и ходовой в Минске</h1><p>ул. Мележа, 5, корп. 2. Телефон: <a href="tel:+375291556156">+375 29 155-61-56</a>. Пн–Пт 9:00–19:00, Сб 10:00–16:00, Вс выходной.</p></noscript>

<script>
(function(){
const S = SITE, y = S.yandex || {}, L = S.legal || {};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; };
const tel = "tel:" + S.phone.replace(/[^\d+]/g, "");
const viber = S.viber ? "viber://chat?number=" + encodeURIComponent(S.viber.replace(/[^\d+]/g, "")) : "";
const tg = S.telegram ? "https://t.me/" + encodeURIComponent(S.telegram) : "";
const street = S.address.replace(/^Минск,\s*/, "");
const STAR = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.5 6 .7-4.5 4.1 1.2 5.9L10 14.8l-5.3 2.9 1.2-5.9L1.4 7.7l6-.7z"/></svg>';
const stars = n => `<span class="stars" aria-label="${n} из 5">${STAR.repeat(n)}</span>`;
const PIN = '<svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const marks = y.marks ? `${y.marks} ${plural(y.marks,"оценка","оценки","оценок")}` : "";
const revs = y.reviews ? `${y.reviews} ${plural(y.reviews,"отзыв","отзыва","отзывов")}` : "";
const logo = n => n.startsWith("GT") ? `<b>GT</b>${esc(n.slice(2))}` : esc(n);
const wide = matchMedia("(min-width: 761px)");

/* открыто ли сейчас (время Минска) */
const nowTxt = () => {
  if (!S.schedule?.length) return "";
  const m = new Date(Date.now() + 3 * 3600e3), d = m.getUTCDay() || 7, h = m.getUTCHours() + m.getUTCMinutes() / 60;
  const t = S.schedule.find(s => s.d.includes(d));
  if (t && h >= t.from && h < t.to) return `<div class="now open rv" style="--d:.25s"><i></i><span>Сейчас открыто, до ${t.to}:00</span></div>`;
  return `<div class="now rv" style="--d:.25s"><i></i><span>Сейчас закрыто</span></div>`;
};

const nav = [
  S.prices?.length && ["#ceny","Цены"], S.reviews?.length && ["#otzyvy","Отзывы"], S.services?.length && ["#uslugi","Услуги"],
  S.why?.length && ["#pochemu","Почему мы"], ["#kontakty","Контакты"]
].filter(Boolean);

/* шапка */
const hdr = `<header class="hdr"><div class="wrap">
  <a class="logo" href="#top" aria-label="${esc(S.name)}">${logo(S.name)}</a>
  <nav class="nav">${nav.map(n => `<a href="${n[0]}">${n[1]}</a>`).join("")}</nav>
  ${S.hours?.length ? `<span class="hh">${S.hours.filter(x => !/выходн/.test(x[1])).map(x => esc(x.join(" "))).join("<br>")}</span>` : ""}
  <a class="btn btn-ac btn-sm" href="${tel}">Позвонить</a>
  <button class="burger" type="button" aria-label="Меню"><i></i></button>
</div></header>`;

/* первый экран */
const hero = `<section class="hero" id="top">
  <div class="wrap grid">
    <div>
      <h1 class="rv">${S.titleAccent ? esc(S.title).replace(esc(S.titleAccent), `<em>${esc(S.titleAccent)}</em>`) : esc(S.title)}</h1>
      <p class="lead rv" style="--d:.1s">${esc(S.lead)}</p>
      <div class="acts rv" style="--d:.2s">
        <a class="btn btn-ac" href="${tel}">Позвонить ${esc(S.phone)}</a>
        ${y.url ? `<a class="btn btn-gh" href="${esc(y.url)}" target="_blank" rel="noopener">Как проехать</a>` : ""}
      </div>
      ${nowTxt()}
      ${y.rating ? `<div class="trust rv" style="--d:.3s"><b>${esc(y.rating)}</b><div>${stars(5)}<span style="display:block;margin-top:4px">${marks} · ${revs} на Яндекс Картах</span></div></div>` : ""}
    </div>
    ${S.img?.hero ? `<div class="car rv" style="--d:.15s"><img src="${esc(S.img.hero)}" alt="Турбина — ремонт турбин и двигателей в автосервисе ${esc(S.name)}, Минск" width="432" height="374" fetchpriority="high"></div>` : ""}
  </div>
</section>`;

/* цены */
const minP = g => Math.min(...g.items.map(i => i[1]));
const prices = S.prices?.length ? `<section id="ceny"><div class="wrap">
  <div class="ph2">
    <div><h2 class="rv">Цены</h2><p class="rv" style="--d:.08s">Цены в белорусских рублях.</p></div>
  </div>
  <div class="pgrid">${S.prices.map((g, i) => `<details class="pg rv" style="--d:${(i % 2) * .06}s"${wide.matches || i === 0 ? " open" : ""}>
    <summary><h3>${esc(g.g)}</h3><small>${g.items.length > 1 ? `от ${minP(g)} BYN` : `${g.items[0][1]} BYN`}</small><span class="chev" aria-hidden="true">${CHEV}</span></summary>
    <ul>${g.items.map(it => `<li><span>${esc(it[0])}${it[2] ? `<small>${esc(it[2])}</small>` : ""}</span><b>${it[1]}<em>BYN</em></b></li>`).join("")}</ul>
  </details>`).join("")}</div>
  <div class="pnote rv"><p>${esc(S.pricesNote)}</p><a class="btn btn-ac btn-sm" href="${tel}">Позвонить и записаться</a></div>
</div></section>` : "";

/* отзывы */
const rev = (S.reviews?.length || y.rating) ? `<section id="otzyvy" style="padding-top:0"><div class="wrap">
  <h2 class="rv">Что говорят клиенты</h2>
  <div class="rev">
    ${y.rating ? `<div class="rate rv">
      <div class="src">${PIN}Яндекс Карты</div>
      <div class="big"><b>${esc(y.rating)}</b>${stars(5)}</div>
      <div class="sub">${marks} · ${revs}</div>
      ${y.url ? `<a class="btn btn-gh btn-sm" href="${esc(y.url)}reviews/" target="_blank" rel="noopener">Все отзывы на Яндекс Картах</a>` : ""}
    </div>` : ""}
    <div class="quotes">${(S.reviews || []).map((r, i) => `<article class="q rv" style="--d:${(i % 2) * .08}s">
      <header><div class="ava">${esc([...r.name][0].toUpperCase())}</div><div><b>${esc(r.name)}</b><small>${esc(r.date || "")}</small></div></header>
      ${stars(r.stars || 5)}<p>${esc(r.text)}</p>
    </article>`).join("")}</div>
  </div>
</div></section>` : "";

/* что ещё делаем */
const svc = S.services?.length ? `<section id="uslugi" style="padding-top:0"><div class="wrap">
  <h2 class="rv">Что ещё делаем</h2>
  <div class="svc">${S.services.map((g, i) => `<article class="sv rv" style="--d:${(i % 2) * .08}s">
    ${g.img ? `<div class="pic"><img src="${esc(g.img)}" alt="${esc(g.title)} — ${esc(S.name)}, Минск" loading="lazy" decoding="async"></div>` : ""}
    <h3>${esc(g.title)}</h3>
    <div class="chips">${g.items.map(t => `<span>${esc(t)}</span>`).join("")}</div>
  </article>`).join("")}</div>
</div></section>` : "";

/* почему мы */
const ICONS = {
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8.5 14.5h3"/></svg>'
};
const why = S.why?.length ? `<section id="pochemu" style="padding-top:0"><div class="wrap">
  <h2 class="rv">Почему мы</h2>
  <div class="why">
    ${S.brandsText ? `<div class="brands rv"><div><small>С какими авто работаем</small><h3>${esc(S.brandsText)}</h3></div>${S.img?.brands ? `<img src="${esc(S.img.brands)}" alt="Ремонт легковых и коммерческих авто — ${esc(S.name)}, Минск" loading="lazy" decoding="async">` : ""}</div>` : ""}
    ${S.why.map((w, i) => `<div class="rv" style="--d:${(i + 1) * .08}s"><span class="ic">${ICONS[w.icon] || ""}</span><h3>${esc(w.t)}</h3><p>${esc(w.text)}</p></div>`).join("")}
  </div>
</div></section>` : "";

/* как записаться */
const steps = S.steps?.length ? `<section id="zapis" style="padding-top:0"><div class="wrap">
  <h2 class="rv">Как записаться</h2>
  <div class="steps">${S.steps.map((s, i) => `<div class="step rv" style="--d:${i * .1}s"><i></i><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></div>`).join("")}</div>
  <div class="steps-cta rv"><a class="btn btn-ac" href="${tel}">Позвонить ${esc(S.phone)}</a>${viber ? `<a class="btn btn-gh" href="${viber}">Viber</a>` : ""}${tg ? `<a class="btn btn-gh" href="${tg}">Telegram</a>` : ""}</div>
</div></section>` : "";

/* контакты */
const cnt = `<section id="kontakty" style="padding-top:0"><div class="wrap">
  <h2 class="rv">Как нас найти</h2>
  <div class="cnt">
    <dl class="info rv">
      <div><dt>Адрес</dt><dd>${esc(S.address)}</dd></div>
      <div><dt>Телефон</dt><dd><a href="${tel}">${esc(S.phone)}</a></dd></div>
      ${S.hours?.length ? `<div><dt>Часы работы</dt><dd class="hrs">${S.hours.map(h => `<span>${esc(h[0])}</span><span>${esc(h[1])}</span>`).join("")}</dd></div>` : ""}
      ${viber || tg ? `<div><dt>Написать</dt><dd>${[viber && `<a href="${viber}">Viber</a>`, tg && `<a href="${tg}">Telegram</a>`].filter(Boolean).join(" · ")}</dd></div>` : ""}
      ${y.url ? `<a class="btn btn-ac btn-sm" href="${esc(y.url)}" target="_blank" rel="noopener">Построить маршрут</a>` : ""}
    </dl>
    ${y.id ? `<div class="map rv" style="--d:.1s" data-src="https://yandex.by/map-widget/v1/org/${esc(y.slug || "org")}/${esc(y.id)}/?z=16"><div class="ph">${PIN}Загружаем карту…</div><button class="cover" type="button" aria-label="Включить карту"><span>Нажмите, чтобы двигать карту</span></button></div>` : ""}
  </div>
</div></section>`;

/* призыв */
const cta = `<section style="padding-top:0"><div class="wrap"><div class="cta rv">
  <div>
    <h2>Записаться на ремонт</h2>
    <a class="tel" href="${tel}">${esc(S.phone)}</a>
    <div class="row"><a class="btn inv" href="${tel}">Позвонить</a>${y.url ? `<a class="btn" href="${esc(y.url)}" target="_blank" rel="noopener">Открыть на карте</a>` : ""}</div>
  </div>
  ${S.img?.cta ? `<div class="tools"><img src="${esc(S.img.cta)}" alt="Инструменты автосервиса ${esc(S.name)}" loading="lazy"></div>` : ""}
</div></div></section>`;

/* подвал */
const req = [L.company, L.unp && "УНП " + L.unp, L.regInfo].filter(Boolean).map(esc).join(" · ");
const ftr = `<footer class="ftr"><div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo">${logo(S.name)}</span><p>${esc(S.lead)}</p>
      ${y.rating ? `${stars(5)}<small>${esc(y.rating)} · ${marks} на Яндекс Картах</small>` : ""}</div>
    <div><h4>Контакты</h4><ul>
      <li><a href="${tel}">${esc(S.phone)}</a></li><li>${esc(street)}</li>
      ${S.hours?.length ? S.hours.map(h => `<li>${esc(h.join(" "))}</li>`).join("") : ""}
    </ul></div>
    <div><h4>Разделы</h4><ul>${nav.map(n => `<li><a href="${n[0]}">${n[1]}</a></li>`).join("")}</ul></div>
    <div><h4>Документы</h4><ul>
      <li><button type="button" data-open="privacy">Политика конфиденциальности</button></li>
      ${y.url ? `<li><a href="${esc(y.url)}" target="_blank" rel="noopener">Мы на Яндекс Картах</a></li>` : ""}
    </ul></div>
  </div>
  <div class="bot"><span>© ${new Date().getFullYear()} ${esc(S.name)}${req ? " · " + req : ""}</span><span>Рейтинг и отзывы — Яндекс Карты</span></div>
</div></footer>
${S.demo ? `<div class="demo">Демо-версия сайта. Подготовлена бесплатно, удалим по первой просьбе.</div>` : ""}`;

/* политика конфиденциальности */
const owner = esc(L.company || S.name) + (L.unp ? ", УНП " + esc(L.unp) : "");
const privacy = `<dialog id="privacy" aria-label="Политика конфиденциальности">
  <div class="d-top"><b>Политика конфиденциальности</b><button class="x" type="button" data-close aria-label="Закрыть">×</button></div>
  <div class="in-d">
  <p>Документ составлен в соответствии с Законом Республики Беларусь от 7 мая 2021 г. № 99-З «О защите персональных данных».</p>
  <h3>Кто отвечает за сайт</h3><p>${owner}. Адрес: ${esc(S.address)}. Телефон: ${esc(S.phone)}${L.email ? ". E-mail: " + esc(L.email) : ""}.</p>
  <h3>Какие данные мы собираем</h3><p>На сайте нет форм и регистрации: мы не просим ввести имя, телефон или другие персональные данные. Связаться с нами можно по телефону${viber || tg ? " или в мессенджере" : ""} — в этом случае данные обрабатываются только для ответа на ваше обращение и записи на ремонт.</p>
  <h3>Сторонние сервисы</h3><p>На сайте работают сервисы других компаний, которые могут сохранять файлы cookie и получать технические данные (IP-адрес, тип браузера):</p>
  <ul><li>Яндекс Карты — карта с нашим адресом (ООО «Яндекс»);</li><li>Google Fonts — шрифты сайта (Google LLC).</li></ul>
  <p>Их обработку регулируют политики этих компаний. Отключить cookie можно в настройках браузера — сайт продолжит работать.</p>
  <h3>Ваши права</h3><p>Вы вправе получить информацию об обработке ваших данных, потребовать их изменения или удаления, отозвать согласие. Для этого обратитесь по контактам выше.</p>
</div></dialog>`;

$("#app").outerHTML = hdr + `<main>${hero}${prices}${rev}${svc}${why}${steps}${cnt}${cta}</main>` + ftr + privacy;

const root = document.documentElement;

/* цены: на компьютере группы всегда открыты, на телефоне — по нажатию */
document.querySelectorAll(".pg summary").forEach(s => s.addEventListener("click", e => { if (wide.matches) e.preventDefault(); }));
wide.addEventListener("change", () => document.querySelectorAll(".pg").forEach((d, k) => d.open = wide.matches || k === 0));

/* политика: открыть / закрыть, ссылка #privacy */
const dlg = $("#privacy");
const openP = () => { root.classList.add("lock"); dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", ""); };
dlg.addEventListener("close", () => root.classList.remove("lock"));
document.querySelectorAll("[data-open=privacy]").forEach(b => b.onclick = openP);
dlg.querySelector("[data-close]").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
if (location.hash === "#privacy") openP();

/* меню и переходы к блокам */
$(".burger").onclick = () => root.classList.toggle("menu-open");
$(".hdr").addEventListener("click", e => { if (e.target === $(".hdr")) root.classList.remove("menu-open"); });
addEventListener("keydown", e => { if (e.key === "Escape") root.classList.remove("menu-open"); });
document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener("click", e => {
  const id = a.getAttribute("href"); if (id === "#") return;
  const t = id === "#top" ? document.body : $(id); if (!t) return;
  e.preventDefault(); root.classList.remove("menu-open");
  t.querySelectorAll(".rv").forEach(el => el.classList.add("in"));
  const top = id === "#top" ? 0 : scrollY + t.getBoundingClientRect().top - 64;
  scrollTo({ top: Math.max(0, top), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  history.replaceState(null, "", id);
}));

/* карта: начинает грузиться заранее, показывается плавно; на телефоне включается касанием */
const map = $(".map[data-src]");
if (map) {
  const load = () => { if (map.querySelector("iframe")) return;
    const f = document.createElement("iframe");
    f.src = map.dataset.src; f.title = S.name + " на карте"; f.allowFullscreen = true;
    f.onload = () => setTimeout(() => map.classList.add("ok"), 150);
    map.appendChild(f); };
  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { load(); o.disconnect(); } }, { rootMargin: "1200px 0px" }).observe(map);
  map.querySelector(".cover").onclick = e => e.currentTarget.remove();
}

/* шапка с фоном после прокрутки */
const h = $(".hdr");
const onScroll = () => h.classList.toggle("solid", scrollY > 20);
addEventListener("scroll", onScroll, { passive: true }); onScroll();

/* плавное появление */
const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return;
  e.target.classList.add("in"); io.unobserve(e.target); }),
  { rootMargin: "0px 0px -8% 0px" });
document.querySelectorAll(".rv").forEach(el => io.observe(el));
})();
</script>
</body>
</html>
