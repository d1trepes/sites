<style>
:root{--f-head:"Unbounded",system-ui,sans-serif;--f-body:"Onest",system-ui,sans-serif;--r:24px;--r-sm:16px;--wrap:1240px;--gut:16px;--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme="гаражная"]{--bg:#0d0e0d;--bg2:#141514;--card:#1a1b1a;--card2:#212220;--line:#2a2b29;--tx:#f1f2ec;--mut:#9a9c94;--ac:#c6f135;--on-ac:#0d0e0d;--star:#ffc531;--pin:#fc3f1d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
h1,h2,h3{font-family:var(--f-head);font-weight:700;letter-spacing:-.02em;line-height:1.06}
h2{font-size:clamp(28px,4.4vw,52px);margin-bottom:clamp(28px,4vw,48px);max-width:18ch}
section{padding:clamp(56px,8vw,112px) 0}
.mut{color:var(--mut)}
.stars{display:inline-flex;gap:2px;color:var(--star)}
.stars svg{width:16px;height:16px}
.pin{width:18px;height:18px;color:var(--pin);flex:none}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 28px;border-radius:99px;font:600 16px var(--f-body);border:1px solid var(--line);transition:transform .2s,background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-ac{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.btn-ac:hover{filter:brightness(1.08)}
.btn-gh:hover{border-color:var(--tx)}
.btn-sm{height:44px;padding:0 20px;font-size:15px}

/* шапка */
.hdr{position:fixed;inset:0 0 auto;z-index:20;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.hdr.solid{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:32px;height:72px}
.logo{font:700 16px var(--f-head);text-transform:uppercase}
.nav{display:flex;gap:26px;margin-left:auto;font-weight:500;font-size:15px}
.nav a{color:var(--mut);transition:color .2s}.nav a:hover{color:var(--tx)}
@media(max-width:960px){.nav{display:none}.hdr .btn{margin-left:auto}}

/* первый экран */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:112px 0 0;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:.9fr 1.25fr;align-items:center;gap:24px;position:relative;z-index:1}
.hero h1{font-size:clamp(36px,5vw,68px);max-width:12ch}
.hero .lead{font-size:clamp(17px,1.5vw,19px);color:var(--mut);max-width:38ch;margin-top:22px}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.trust{display:flex;align-items:center;gap:14px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line);max-width:440px}
.trust b{font:700 30px/1 var(--f-head);letter-spacing:-.03em}
.trust span{font-size:14px;color:var(--mut);line-height:1.35}.trust .stars{color:var(--star)}
.car{position:relative;aspect-ratio:1.45}
.car::before{content:"";position:absolute;left:8%;right:4%;top:22%;bottom:12%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 30%,transparent),transparent);filter:blur(30px);opacity:.55}
.car::after{content:"";position:absolute;left:12%;right:10%;bottom:14%;height:8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);animation:shadow 6s ease-in-out infinite}
.car img{position:absolute;inset:-4% -6%;width:112%;height:108%;object-fit:contain;z-index:1;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes shadow{50%{transform:scaleX(.92);opacity:.7}}
.mark{position:absolute;left:0;right:0;bottom:-.14em;font:700 clamp(64px,15vw,230px)/.8 var(--f-head);letter-spacing:-.05em;white-space:nowrap;color:transparent;-webkit-text-stroke:1px var(--line);text-transform:uppercase;user-select:none;text-align:center;z-index:0}
@media(max-width:900px){.hero{min-height:auto;padding-bottom:56px}.hero .grid{grid-template-columns:1fr}.car{order:-1;margin:0 -8px;aspect-ratio:1.7}.hero .acts .btn{flex:1 1 100%}}

/* факты */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px 24px;transition:transform .35s var(--ease),border-color .3s}
.fact:hover{transform:translateY(-4px);border-color:var(--mut)}
.fact .pic{height:150px;display:grid;place-items:center;margin-bottom:18px;border-radius:var(--r-sm);background:radial-gradient(60% 70% at 50% 60%,var(--card2),transparent)}
.fact .pic img{max-height:130px;max-width:92%;object-fit:contain;transition:transform .5s var(--ease)}
.fact:hover .pic img{transform:scale(1.06)}
.fact p{font-weight:500;font-size:17px;line-height:1.35}
@media(max-width:960px){.facts{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.fact .pic{height:110px}.fact .pic img{max-height:96px}.fact p{font-size:15px}.fact{padding:14px 14px 18px}}

/* бегущая строка */
.brands{padding:clamp(40px,6vw,72px) 0 0}
.brands h3{font:500 15px var(--f-body);color:var(--mut);margin-bottom:18px}
.marq{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq div{display:flex;width:max-content;animation:marq 40s linear infinite}
.marq span{font:700 clamp(26px,3.6vw,46px)/1 var(--f-head);letter-spacing:-.02em;padding:22px 28px;white-space:nowrap}
.marq span:nth-child(even){color:transparent;-webkit-text-stroke:1px var(--mut)}
@keyframes marq{to{transform:translateX(-50%)}}

/* услуги */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sv{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .3s}
.sv:hover{border-color:var(--mut)}
.sv.big{min-height:520px}
.sv .pic{height:220px;margin:-8px -8px 18px;display:grid;place-items:center;border-radius:var(--r-sm);background:radial-gradient(55% 65% at 50% 55%,var(--card2),transparent)}
.sv .pic img{max-height:200px;max-width:80%;object-fit:contain;transition:transform .6s var(--ease)}
.sv:hover .pic img{transform:translateY(-6px) rotate(-2deg) scale(1.04)}
.sv h3{font-size:21px;line-height:1.2;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.chips span{border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:14.5px;line-height:1.2}
.chips span b{color:var(--ac);font-weight:600;margin-left:6px}
.sv .btn{margin-top:auto;align-self:flex-start}
@media(max-width:960px){.svc{grid-template-columns:1fr 1fr}.sv.big{min-height:0}}
@media(max-width:640px){.svc{grid-template-columns:1fr}.sv{padding:22px}.sv .pic{height:170px}.sv .pic img{max-height:150px}}

/* почему мы */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.why div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 26px 30px;display:flex;flex-direction:column;justify-content:space-between;min-height:240px}
.why b{font:700 clamp(48px,5vw,72px)/1 var(--f-head);letter-spacing:-.05em}
.why div:first-child{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.why p{font-size:16.5px;line-height:1.4;margin-top:24px}
.why div:not(:first-child) p{color:var(--mut)}
@media(max-width:960px){.why{grid-template-columns:1fr 1fr}.why div{min-height:200px}}
@media(max-width:520px){.why div{padding:20px;min-height:170px}.why p{font-size:14.5px}}

/* как записаться */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;counter-reset:s}
.step{position:relative;padding:28px 0 0;border-top:1px solid var(--line)}
.step::before{content:"";position:absolute;left:0;top:-1px;height:2px;width:100%;background:var(--ac);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease)}
.step.in::before{transform:none}
.step:nth-child(2)::before{transition-delay:.25s}.step:nth-child(3)::before{transition-delay:.5s}
.step i{counter-increment:s;font:700 15px var(--f-head);color:var(--ac);font-style:normal}
.step i::before{content:"0" counter(s)}
.step h3{font-size:clamp(20px,2vw,26px);margin:14px 0 10px}
.step p{color:var(--mut);max-width:30ch}
.steps-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
@media(max-width:760px){.steps{grid-template-columns:1fr;gap:28px}}

/* отзывы */
.rev{display:grid;grid-template-columns:380px 1fr;gap:12px;align-items:start}
.rate{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:30px;position:sticky;top:96px}
.src{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
.rate .big{display:flex;align-items:center;gap:16px;margin:22px 0 6px}
.rate .big b{font:700 80px/1 var(--f-head);letter-spacing:-.05em}
.rate .big .stars svg{width:20px;height:20px}
.rate .sub{color:var(--mut);margin-bottom:26px;font-size:15px}
.bar{margin-top:14px}
.bar div{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
.bar i{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i::after{content:"";display:block;height:100%;width:var(--w);background:var(--ac);border-radius:9px;transform-origin:left;transform:scaleX(0);transition:transform 1.1s var(--ease)}
.in .bar i::after{transform:scaleX(1)}
.rate .note{font-size:13px;color:var(--mut);margin-top:12px}
.rate .btn{margin-top:26px;width:100%}
.quotes{columns:2;column-gap:12px}
.q{break-inside:avoid;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;margin-bottom:12px}
.q header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-head);background:var(--card2);color:var(--ac);flex:none}
.q header b{display:block;font-weight:600;line-height:1.2}
.q header small{color:var(--mut);font-size:13px}
.q .stars{margin-bottom:10px}
.q p{font-size:16.5px;line-height:1.5}
@media(max-width:1000px){.rev{grid-template-columns:1fr}.rate{position:static}}
@media(max-width:700px){.quotes{columns:auto;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--gut)*-1);padding:0 var(--gut) 6px;scrollbar-width:none}.quotes::-webkit-scrollbar{display:none}.q{flex:0 0 84%;scroll-snap-align:start;margin:0}}

/* контакты */
.cnt{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}
.info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;display:flex;flex-direction:column;gap:24px}
.info dt{color:var(--mut);font-size:14px;margin-bottom:6px}
.info dd{font-size:18px;font-weight:500}
.info dd a{border-bottom:1px solid var(--line)}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:4px 20px}
.info .btn{margin-top:auto;align-self:flex-start}
.map{border-radius:var(--r);overflow:hidden;min-height:440px;background:var(--card);border:1px solid var(--line)}
.map iframe{width:100%;height:100%;min-height:440px;border:0;display:block}
@media(max-width:860px){.cnt{grid-template-columns:1fr}.map,.map iframe{min-height:340px}}

/* призыв */
.cta{position:relative;background:var(--ac);color:var(--on-ac);border-radius:calc(var(--r) + 8px);padding:clamp(32px,6vw,72px);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:24px;overflow:hidden}
.cta h2{margin:0 0 20px;font-size:clamp(30px,4.8vw,62px)}
.cta .tel{display:inline-block;font:700 clamp(24px,3.6vw,46px)/1 var(--f-head);letter-spacing:-.03em;margin-bottom:28px}
.cta .row{display:flex;flex-wrap:wrap;gap:12px}
.cta .btn{border-color:currentColor;color:inherit}
.cta .btn.inv{background:var(--on-ac);color:var(--ac);border-color:var(--on-ac)}
.cta .tools{position:relative;justify-self:center;width:min(100%,420px)}
.cta .tools img{width:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35));transform:rotate(-4deg);transition:transform .8s var(--ease)}
.cta:hover .tools img{transform:rotate(0) scale(1.03)}
@media(max-width:860px){.cta{grid-template-columns:1fr}.cta .tools{width:70%;order:-1;margin-bottom:-8px}}

/* подвал */
.ftr{background:var(--bg2);border-top:1px solid var(--line);font-size:15px}
.ftr .top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding:56px 0 44px}
.ftr h4{font:500 13px var(--f-body);color:var(--mut);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.ftr li{list-style:none;margin-bottom:9px}
.ftr li a,.ftr li button{transition:color .2s}.ftr li a:hover,.ftr li button:hover{color:var(--ac)}
.ftr .brand .logo{font-size:20px;display:block;margin-bottom:12px}
.ftr .brand p{color:var(--mut);max-width:30ch}
.ftr .brand .stars{margin-top:16px}
.ftr .brand small{display:block;color:var(--mut);margin-top:4px}
.ftr .bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding:20px 0 28px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
@media(max-width:860px){.ftr .top{grid-template-columns:1fr 1fr}.ftr .brand{grid-column:1/-1}}
.demo{background:var(--bg);color:var(--mut);text-align:center;font-size:13px;padding:14px var(--gut);border-top:1px solid var(--line)}

/* политика */
dialog{margin:auto;max-width:720px;width:calc(100% - 32px);max-height:86vh;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--tx);padding:0}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog .in-d{padding:32px;overflow:auto;max-height:86vh}
dialog h2{font-size:26px;margin-bottom:20px;max-width:none}
dialog h3{font:600 17px var(--f-body);margin:22px 0 8px}
dialog p,dialog li{color:var(--mut);font-size:15px;margin-bottom:8px}
dialog ul{padding-left:20px}
dialog .x{position:sticky;top:0;float:right;width:40px;height:40px;border-radius:50%;background:var(--card2);font-size:20px}

/* кнопки внизу на телефоне */
.dock{display:none}
@media(max-width:760px){
  .dock{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .35s}
  .dock.on{transform:none}
  .dock .btn{height:50px;padding:0 12px}
  body{padding-bottom:76px}
}

/* лёгкое появление */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.bar i::after,.step::before{transform:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
const S = SITE, y = S.yandex || {}, L = S.legal || {};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; };
const tel = "tel:" + S.phone.replace(/[^\d+]/g, "");
const viber = S.viber ? "viber://chat?number=" + encodeURIComponent(S.viber.replace(/[^\d+]/g, "")) : "";
const tg = S.telegram ? "https://t.me/" + encodeURIComponent(S.telegram) : "";
const priceHref = (S.priceBy === "viber" && viber) || (S.priceBy === "telegram" && tg) || tel;
const street = S.address.replace(/^Минск,\s*/, "");
const STAR = '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.5 6 .7-4.5 4.1 1.2 5.9L10 14.8l-5.3 2.9 1.2-5.9L1.4 7.7l6-.7z"/></svg>';
const stars = n => `<span class="stars" aria-label="${n} из 5">${STAR.repeat(n)}</span>`;
const PIN = '<svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
const marks = y.marks ? `${y.marks} ${plural(y.marks,"оценка","оценки","оценок")}` : "";
const rv = (i = 0) => `class="rv" style="--d:${(i * .08).toFixed(2)}s"`;
document.documentElement.dataset.theme = S.theme;

const nav = [
  S.services?.length && ["#uslugi","Услуги"], S.why?.length && ["#pochemu","Почему мы"],
  S.reviews?.length && ["#otzyvy","Отзывы"], S.steps?.length && ["#zapis","Как записаться"], ["#kontakty","Контакты"]
].filter(Boolean);

/* шапка */
const hdr = `<header class="hdr"><div class="wrap">
  <a class="logo" href="#top">${esc(S.name)}</a>
  <nav class="nav">${nav.map(n => `<a href="${n[0]}">${n[1]}</a>`).join("")}</nav>
  <a class="btn btn-ac btn-sm" href="${tel}">Позвонить</a>
</div></header>`;

/* первый экран */
const hero = `<section class="hero" id="top">
  <div class="wrap grid">
    <div>
      <h1 ${rv(0)}>${esc(S.title)}</h1>
      <p class="lead rv" style="--d:.1s">${esc(S.lead)}</p>
      <div class="acts rv" style="--d:.2s">
        <a class="btn btn-ac" href="${tel}">Позвонить ${esc(S.phone)}</a>
        ${y.url ? `<a class="btn btn-gh" href="${esc(y.url)}" target="_blank" rel="noopener">Как проехать</a>` : ""}
      </div>
      ${y.rating ? `<div class="trust rv" style="--d:.3s"><b>${esc(y.rating)}</b><div>${stars(5)}<span style="display:block;margin-top:4px">${marks} · ${y.reviews} ${plural(y.reviews,"отзыв","отзыва","отзывов")} на Яндекс Картах</span></div></div>` : ""}
    </div>
    ${S.img?.hero ? `<div class="car rv" style="--d:.15s"><img src="${esc(S.img.hero)}" alt="Автомобиль — ${esc(S.name)}, автосервис в Минске" fetchpriority="high"></div>` : ""}
  </div>
  <div class="mark" aria-hidden="true">${esc(S.name)}</div>
</section>`;

/* факты */
const facts = S.facts?.length ? `<section style="padding-bottom:0"><div class="wrap"><div class="facts">
  ${S.facts.map((f, i) => `<div class="fact rv" style="--d:${i * .08}s">${f.img ? `<div class="pic"><img src="${esc(f.img)}" alt="${esc(f.text)}" loading="lazy" decoding="async"></div>` : ""}<p>${esc(f.text)}</p></div>`).join("")}
</div></div></section>` : "";

/* марки */
const brands = S.brands?.length ? `<div class="brands"><div class="wrap"><h3 class="rv">${esc(S.brandsTitle)}</h3></div>
  <div class="marq rv"><div>${[...S.brands, ...S.brands].map(b => `<span>${esc(b)}</span>`).join("")}</div></div></div>` : "";

/* услуги */
const svc = S.services?.length ? `<section id="uslugi"><div class="wrap">
  <h2 class="rv">Услуги${S.services.some(g => g.items.some(i => i[1])) ? " и цены" : ""}</h2>
  <div class="svc">${S.services.map((g, i) => `<article class="sv ${g.img ? "big" : ""} rv" style="--d:${(i % 3) * .08}s">
    ${g.img ? `<div class="pic"><img src="${esc(g.img)}" alt="${esc(g.title)}" loading="lazy" decoding="async"></div>` : ""}
    <h3>${esc(g.title)}</h3>
    <div class="chips">${g.items.map(it => `<span>${esc(it[0])}${it[1] ? `<b>${esc(it[1])}</b>` : ""}</span>`).join("")}</div>
    <a class="btn btn-gh btn-sm" href="${priceHref}">Узнать цену</a>
  </article>`).join("")}</div>
</div></section>` : "";

/* почему мы */
const why = S.why?.length ? `<section id="pochemu" style="padding-top:0"><div class="wrap">
  <h2 class="rv">Почему выбирают нас</h2>
  <div class="why">${S.why.map((w, i) => `<div class="rv" style="--d:${i * .08}s"><b data-count="${esc(w.big)}">${esc(w.big)}</b><p>${esc(w.text)}</p></div>`).join("")}</div>
</div></section>` : "";

/* отзывы */
const rev = (S.reviews?.length || y.rating) ? `<section id="otzyvy"><div class="wrap">
  <h2 class="rv">Что говорят клиенты</h2>
  <div class="rev">
    ${y.rating ? `<div class="rate rv">
      <div class="src">${PIN}Яндекс Карты</div>
      <div class="big"><b>${esc(y.rating)}</b>${stars(5)}</div>
      <div class="sub">${marks}${y.reviews ? ` · ${y.reviews} ${plural(y.reviews,"отзыв","отзыва","отзывов")}` : ""}</div>
      ${(S.praise || []).map(p => `<div class="bar"><div><span>${esc(p[0])}</span><span>${p[1]}%</span></div><i style="--w:${p[1]}%"></i></div>`).join("")}
      ${S.praise?.length ? `<p class="note">Доля положительных отзывов по темам</p>` : ""}
      ${y.url ? `<a class="btn btn-gh btn-sm" href="${esc(y.url)}reviews/" target="_blank" rel="noopener">Все отзывы на Яндекс Картах</a>` : ""}
    </div>` : ""}
    <div class="quotes">${(S.reviews || []).map((r, i) => `<article class="q rv" style="--d:${(i % 2) * .08}s">
      <header><div class="ava">${esc([...r.name][0].toUpperCase())}</div><div><b>${esc(r.name)}</b><small>${esc(r.date || "")}</small></div></header>
      ${stars(r.stars || 5)}<p>${esc(r.text)}</p>
    </article>`).join("")}</div>
  </div>
</div></section>` : "";

/* как записаться */
const steps = S.steps?.length ? `<section id="zapis" style="padding-top:0"><div class="wrap">
  <h2 class="rv">Как записаться</h2>
  <div class="steps">${S.steps.map((s, i) => `<div class="step rv" style="--d:${i * .1}s"><i></i><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></div>`).join("")}</div>
  <div class="steps-cta rv"><a class="btn btn-ac" href="${tel}">Позвонить ${esc(S.phone)}</a>${viber ? `<a class="btn btn-gh" href="${viber}">Viber</a>` : ""}${tg ? `<a class="btn btn-gh" href="${tg}">Telegram</a>` : ""}</div>
</div></section>` : "";

/* контакты */
const cnt = `<section id="kontakty" style="padding-top:0"><div class="wrap">
  <h2 class="rv">Как нас найти</h2>
  <div class="cnt">
    <dl class="info rv">
      <div><dt>Адрес</dt><dd>${esc(S.address)}</dd></div>
      <div><dt>Телефон</dt><dd><a href="${tel}">${esc(S.phone)}</a></dd></div>
      ${S.hours?.length ? `<div><dt>Часы работы</dt><dd class="hrs">${S.hours.map(h => `<span>${esc(h[0])}</span><span>${esc(h[1])}</span>`).join("")}</dd></div>` : ""}
      ${S.route?.length ? `<div><dt>Как добраться</dt><dd>${S.route.map(esc).join("<br>")}</dd></div>` : ""}
      ${viber || tg ? `<div><dt>Написать</dt><dd>${[viber && `<a href="${viber}">Viber</a>`, tg && `<a href="${tg}">Telegram</a>`].filter(Boolean).join(" · ")}</dd></div>` : ""}
      ${y.url ? `<a class="btn btn-ac btn-sm" href="${esc(y.url)}" target="_blank" rel="noopener">Построить маршрут</a>` : ""}
    </dl>
    ${y.id ? `<div class="map rv" style="--d:.1s"><iframe src="https://yandex.by/map-widget/v1/org/${esc(y.slug || "org")}/${esc(y.id)}/?z=16" title="${esc(S.name)} на карте" loading="lazy" allowfullscreen></iframe></div>` : ""}
  </div>
</div></section>`;

/* призыв */
const cta = `<section style="padding-top:0"><div class="wrap"><div class="cta rv">
  <div>
    <h2>Записаться на ремонт</h2>
    <a class="tel" href="${tel}">${esc(S.phone)}</a>
    <div class="row"><a class="btn inv" href="${tel}">Позвонить</a>${y.url ? `<a class="btn" href="${esc(y.url)}" target="_blank" rel="noopener">Открыть на карте</a>` : ""}</div>
  </div>
  ${S.img?.cta ? `<div class="tools"><img src="${esc(S.img.cta)}" alt="Инструменты автосервиса ${esc(S.name)}" loading="lazy"></div>` : ""}
</div></div></section>`;

/* подвал */
const req = [L.company, L.unp && "УНП " + L.unp, L.regInfo].filter(Boolean).map(esc).join(" · ");
const ftr = `<footer class="ftr"><div class="wrap">
  <div class="top">
    <div class="brand"><span class="logo">${esc(S.name)}</span><p>${esc(S.lead)}</p>
      ${y.rating ? `${stars(5)}<small>${esc(y.rating)} · ${marks} на Яндекс Картах</small>` : ""}</div>
    <div><h4>Контакты</h4><ul>
      <li><a href="${tel}">${esc(S.phone)}</a></li><li>${esc(street)}</li>
      ${S.hours?.length ? S.hours.map(h => `<li>${esc(h.join(" "))}</li>`).join("") : ""}
      ${viber ? `<li><a href="${viber}">Viber</a></li>` : ""}${tg ? `<li><a href="${tg}">Telegram</a></li>` : ""}
    </ul></div>
    <div><h4>Разделы</h4><ul>${nav.map(n => `<li><a href="${n[0]}">${n[1]}</a></li>`).join("")}</ul></div>
    <div><h4>Документы</h4><ul>
      <li><button type="button" data-open="privacy">Политика конфиденциальности</button></li>
      ${y.url ? `<li><a href="${esc(y.url)}" target="_blank" rel="noopener">Мы на Яндекс Картах</a></li>` : ""}
    </ul></div>
  </div>
  <div class="bot"><span>© ${new Date().getFullYear()} ${esc(S.name)}${req ? " · " + req : ""}</span><span>Рейтинг и отзывы — Яндекс Карты</span></div>
</div></footer>
${S.demo ? `<div class="demo">Демо-версия сайта. Подготовлена бесплатно, удалим по первой просьбе.</div>` : ""}`;

/* политика конфиденциальности */
const owner = esc(L.company || S.name) + (L.unp ? ", УНП " + esc(L.unp) : "");
const privacy = `<dialog id="privacy" aria-label="Политика конфиденциальности"><div class="in-d">
  <button class="x" type="button" data-close aria-label="Закрыть">×</button>
  <h2>Политика конфиденциальности</h2>
  <p>Документ составлен в соответствии с Законом Республики Беларусь от 7 мая 2021 г. № 99-З «О защите персональных данных».</p>
  <h3>Кто отвечает за сайт</h3><p>${owner}. Адрес: ${esc(S.address)}. Телефон: ${esc(S.phone)}${L.email ? ". E-mail: " + esc(L.email) : ""}.</p>
  <h3>Какие данные мы собираем</h3><p>На сайте нет форм и регистрации: мы не просим ввести имя, телефон или другие персональные данные. Связаться с нами можно по телефону${viber || tg ? " или в мессенджере" : ""} — в этом случае данные обрабатываются только для ответа на ваше обращение и записи на ремонт.</p>
  <h3>Сторонние сервисы</h3><p>На сайте работают сервисы других компаний, которые могут сохранять файлы cookie и получать технические данные (IP-адрес, тип браузера):</p>
  <ul><li>Яндекс Карты — карта с нашим адресом (ООО «Яндекс»);</li><li>Google Fonts — шрифты сайта (Google LLC).</li></ul>
  <p>Их обработку регулируют политики этих компаний. Отключить cookie можно в настройках браузера — сайт продолжит работать.</p>
  <h3>Ваши права</h3><p>Вы вправе получить информацию об обработке ваших данных, потребовать их изменения или удаления, отозвать согласие. Для этого обратитесь по контактам выше.</p>
</div></dialog>`;

const dock = `<div class="dock"><a class="btn btn-ac" href="${tel}">Позвонить</a>${y.url ? `<a class="btn btn-gh" href="${esc(y.url)}" target="_blank" rel="noopener">Маршрут</a>` : `<a class="btn btn-gh" href="#kontakty">Адрес</a>`}</div>`;

$("#app").outerHTML = hdr + `<main>${hero}${facts}${brands}${svc}${why}${rev}${steps}${cnt}${cta}</main>` + ftr + privacy + dock;

/* разметка для поисковиков — только из данных выше */
const ld = { "@context": "https://schema.org", "@type": "AutoRepair", name: S.name, telephone: S.phone,
  address: { "@type": "PostalAddress", streetAddress: street, addressLocality: "Минск", addressCountry: "BY" },
  paymentAccepted: "Наличные, карта" };
if (S.img?.hero) ld.image = new URL(S.img.hero, location.href).href;
if (y.url) ld.sameAs = [y.url];
if (y.rating && y.marks) ld.aggregateRating = { "@type": "AggregateRating", ratingValue: y.rating.replace(",", "."), ratingCount: y.marks, reviewCount: y.reviews, bestRating: 5 };
const s = document.createElement("script"); s.type = "application/ld+json"; s.textContent = JSON.stringify(ld); document.head.appendChild(s);

/* политика: открыть / закрыть, ссылка #privacy */
const dlg = $("#privacy");
const openP = () => dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", "");
document.querySelectorAll("[data-open=privacy]").forEach(b => b.onclick = openP);
dlg.querySelector("[data-close]").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
if (location.hash === "#privacy") openP();

/* шапка с фоном, кнопки внизу на телефоне */
const h = $(".hdr"), d = $(".dock");
const onScroll = () => { const t = scrollY; h.classList.toggle("solid", t > 20); d.classList.toggle("on", t > innerHeight * .6); };
addEventListener("scroll", onScroll, { passive: true }); onScroll();

/* счётчик чисел в «Почему мы» */
const count = el => {
  const raw = el.dataset.count, m = raw.match(/^(\d+)(?:[,.](\d+))?(.*)$/); if (!m) return;
  const dec = m[2] ? m[2].length : 0, end = parseFloat(m[1] + "." + (m[2] || 0)), tail = m[3], t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 1200), v = end * (1 - Math.pow(1 - k, 3));
    el.textContent = v.toFixed(dec).replace(".", ",") + tail; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
};

/* плавное появление */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return;
  e.target.classList.add("in"); if (!reduce) e.target.querySelectorAll("[data-count]").forEach(count); io.unobserve(e.target); }),
  { rootMargin: "0px 0px -8% 0px" });
document.querySelectorAll(".rv").forEach(el => io.observe(el));
})();
</script>
</body>
</html>
