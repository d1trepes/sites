<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">

<meta name="robots" content="noindex, nofollow">
<title>Ганс Моторс — автосервис и шиномонтаж на ул. Скорины, 52, Минск</title>
<meta name="description" content="Ганс Моторс в Минске: ремонт двигателя, ходовой, КПП и тормозов, компьютерная диагностика, кондиционеры, шиномонтаж, ремонт мотоциклов. ул. Франциска Скорины, 52, корп. 10.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_BY">
<meta property="og:title" content="Ганс Моторс — автосервис на ул. Скорины, 52, Минск">
<meta property="og:description" content="Ремонт авто и мото, диагностика, шиномонтаж. Рейтинг 5,0 на Яндекс Картах.">
<!-- <meta property="og:image" content="photos/hero.jpg"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   НАСТРОЙКИ И ДАННЫЕ СЕРВИСА — всё меняется только здесь.
   Пустое поле или пустой список = блок не показывается.
   ===================================================================== */
const SITE = {
  theme: "гаражная",          // "светлая" | "тёмная" | "гаражная"
  hero:  "C",                 // "A" фото на весь экран | "B" текст + фото | "C" без фото
  demo:  true,                // плашка демо-версии внизу

  name:    "Ганс Моторс",
  title:   "Автосервис и шиномонтаж на Скорины, 52",          // главный заголовок (h1)
  lead:    "Ремонт двигателя, ходовой и КПП, диагностика, кондиционеры, шиномонтаж. Легковые и коммерческие авто, мотоциклы и квадроциклы.",
  phone:   "+375 44 573-04-01",
  viber:   "",                // номер для Viber, например "+375291234567"
  telegram:"",                // ник без @
  address: "Минск, ул. Франциска Скорины, 52, корп. 10",
  hours:   [],                // например [["Пн–Пт","9:00–18:00"],["Сб–Вс","выходной"]]
  route:   ["Остановка «Сосновый Бор» — 280 м", "Метро «Уручье» — 2 км"],

  yandex: { url: "https://yandex.by/maps/org/gans_motors/1280047813/", id: "1280047813",
            rating: "5,0", marks: 304, reviews: 125 },

  heroPhoto: "",              // например "photos/hero.jpg" (нужно для A и B)

  facts: [
    "Легковые, коммерческие и отечественные авто",
    "Мотоциклы и квадроциклы",
    "Запчасти под заказ",
    "Оплата наличными и картой"
  ],

  // Услуги по группам. Цена — второй элемент, если есть: ["Замена масла", "от 30 BYN"]
  services: [
    { title: "Двигатель и трансмиссия", items: [["Ремонт двигателя"],["Замена масла"],["Замена ГРМ"],["Ремонт КПП"],["Ремонт сцепления"],["Ремонт системы охлаждения"]] },
    { title: "Ходовая и тормоза",       items: [["Ремонт ходовой части"],["Ремонт тормозной системы"],["Ремонт рулевых реек"],["Ремонт выхлопной системы"],["Удаление катализаторов"]] },
    { title: "Диагностика и климат",    items: [["Компьютерная диагностика"],["Заправка автокондиционера"],["Ремонт автокондиционера"]] },
    { title: "Шины",                    items: [["Шиномонтаж"],["Балансировка"],["Вулканизация"],["Хранение шин"]] },
    { title: "Мототехника",             items: [["Ремонт мотоциклов и квадроциклов"],["Тюнинг мототехники"]] },
    { title: "Ещё",                     items: [["Полное сервисное обслуживание"],["Сварочные работы"],["Запчасти под заказ"]] }
  ],
  pricesNote: "Стоимость работ назовём по телефону",

  photos: [],                 // [{src:"photos/1.jpg", alt:"Бокс с подъёмником"}]

  // Доля положительных отзывов по темам (с Яндекс Карт)
  praise: [["Персонал",93],["Время ожидания",96],["Ремонт",91],["Шиномонтаж",89]],
  // Отзывы — пересказ своими словами, с именем автора
  reviews: [
    { name: "I'am", text: "Меняли резину на двух машинах — минут по двадцать на каждую, цена устроила." }
  ],

  legal: { company: "", unp: "", regInfo: "" }   // реквизиты: заполняются при запуске
};
</script>

<style>
:root{
  --f-head:"Unbounded",system-ui,sans-serif; --f-body:"Onest",system-ui,sans-serif;
  --r:22px; --r-sm:14px; --wrap:1200px; --gut:16px;
}
[data-theme="гаражная"]{ --bg:#0d0e0d; --bg2:#151615; --card:#1b1c1b; --line:#2a2b29; --tx:#f1f2ec; --mut:#9a9c94; --ac:#c6f135; --on-ac:#0d0e0d; }
[data-theme="тёмная"]  { --bg:#0b0b0c; --bg2:#131315; --card:#19191c; --line:#28282c; --tx:#f3f2ef; --mut:#9b9a96; --ac:#ff6a2b; --on-ac:#fff; }
[data-theme="светлая"] { --bg:#f3f2ee; --bg2:#ebe9e3; --card:#ffffff; --line:#dcd9d1; --tx:#111110; --mut:#6c6a64; --ac:#e0352b; --on-ac:#fff; }

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
h1,h2,h3{font-family:var(--f-head);font-weight:700;letter-spacing:-.02em;line-height:1.05}
h2{font-size:clamp(28px,5vw,52px);margin-bottom:clamp(28px,4vw,48px)}
section{padding:clamp(64px,9vw,120px) 0}
.mut{color:var(--mut)}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 28px;border-radius:99px;font:600 16px var(--f-body);border:1px solid var(--line);transition:transform .2s,background .2s,border-color .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-ac{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.btn-ac:hover{filter:brightness(1.08)}
.btn-gh:hover{border-color:var(--tx)}

/* шапка */
.hdr{position:fixed;inset:0 0 auto;z-index:20;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.hdr.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:32px;height:72px}
.logo{font:700 17px var(--f-head);letter-spacing:-.01em;text-transform:uppercase}
.nav{display:flex;gap:28px;margin-left:auto;font-weight:500}
.nav a{color:var(--mut);transition:color .2s}.nav a:hover{color:var(--tx)}
.hdr .btn{height:44px;padding:0 20px;font-size:15px}
@media(max-width:860px){.nav{display:none}.hdr .btn{margin-left:auto}}

/* первый экран */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px 0 0;overflow:hidden}
.hero h1{font-size:clamp(38px,7.2vw,96px);max-width:13ch}
.hero .lead{font-size:clamp(17px,1.6vw,20px);color:var(--mut);max-width:46ch;margin-top:24px}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.hero-grid{display:grid;grid-template-columns:1fr auto;align-items:end;gap:40px;padding-bottom:clamp(40px,6vw,72px)}
.score{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 30px;min-width:250px}
.score b{display:block;font:700 72px/1 var(--f-head);letter-spacing:-.04em}
.score span{display:block;color:var(--mut);margin-top:12px;font-size:15px}
.score a{display:inline-block;margin-top:14px;font-weight:600;border-bottom:1px solid var(--line)}
.mark{font:700 clamp(64px,17vw,250px)/.8 var(--f-head);letter-spacing:-.05em;white-space:nowrap;color:transparent;-webkit-text-stroke:1px var(--line);text-transform:uppercase;user-select:none;margin-bottom:-.12em;padding-left:var(--gut)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:28px;color:var(--mut);font-size:15px}
.hero-meta b{color:var(--tx);font-weight:500}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.score{min-width:0}.score b{font-size:56px}}

/* A — фото на весь экран */
.hero.A .bgimg{position:absolute;inset:0;z-index:-2;object-fit:cover;width:100%;height:100%}
.hero.A::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.85) 100%)}
.hero.A{color:#fff}.hero.A .lead,.hero.A .hero-meta{color:rgba(255,255,255,.75)}.hero.A .hero-meta b{color:#fff}
.hero.A .score{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.hero.A .score span{color:rgba(255,255,255,.7)}.hero.A .btn-gh{border-color:rgba(255,255,255,.35);color:#fff}
/* B — текст + фото */
.hero.B{justify-content:center;padding-bottom:40px}
.hero.B .split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);align-items:center}
.hero.B .ph{position:relative;aspect-ratio:4/5;border-radius:calc(var(--r) + 6px);overflow:hidden}
.hero.B .ph img{width:100%;height:100%;object-fit:cover}
.hero.B .ph .score{position:absolute;left:16px;bottom:16px;min-width:0;padding:18px 22px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero.B .ph .score b{font-size:44px}
@media(max-width:860px){.hero.B .split{grid-template-columns:1fr}.hero.B .ph{aspect-ratio:4/3}}

/* коротко */
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:28px 24px 28px 0;font-weight:500;font-size:17px;line-height:1.35}
.facts div+div{padding-left:24px;border-left:1px solid var(--line)}
@media(max-width:860px){.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(3){border-left:0;padding-left:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}

/* услуги */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.svc article{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;transition:border-color .25s}
.svc article:hover{border-color:var(--mut)}
.svc .n{font:700 44px/1 var(--f-head);color:var(--ac);letter-spacing:-.04em}
.svc h3{font-size:20px;margin:28px 0 18px;line-height:1.2}
.svc ul{list-style:none}
.svc li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:15.5px}
.svc li b{font-weight:600;white-space:nowrap}
.svc-note{margin-top:20px;color:var(--mut)}
@media(max-width:960px){.svc{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.svc{grid-template-columns:1fr;gap:10px}.svc article{padding:22px;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:baseline}.svc .n{font-size:22px}.svc h3{margin:0 0 14px;font-size:18px}.svc ul{grid-column:1/-1}.svc li{padding:9px 0}
  .hero .acts .btn{flex:1 1 100%}}

/* фото */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;gap:12px}
.gal figure{border-radius:var(--r-sm);overflow:hidden;background:var(--card)}
.gal figure:first-child{grid-column:span 2;grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.gal figure:hover img{transform:scale(1.04)}
@media(max-width:760px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:150px}}

/* отзывы */
.rev{display:grid;grid-template-columns:.8fr 1.2fr;gap:12px}
.rate{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px}
.rate .big{font:700 96px/1 var(--f-head);letter-spacing:-.05em}
.rate .sub{color:var(--mut);margin:10px 0 28px}
.bar{margin-top:16px}
.bar div{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
.bar i{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i::after{content:"";display:block;height:100%;width:var(--w);background:var(--ac);border-radius:9px;transform-origin:left;transform:scaleX(0);transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.in .bar i::after{transform:scaleX(1)}
.rate a{display:inline-block;margin-top:28px;font-weight:600;border-bottom:1px solid var(--line)}
.quotes{display:grid;gap:12px;align-content:start}
.quotes blockquote{background:var(--bg2);border-radius:var(--r);padding:28px 30px}
.quotes p{font-size:clamp(18px,1.7vw,22px);line-height:1.45}
.quotes cite{display:block;margin-top:18px;font-style:normal;color:var(--mut)}
@media(max-width:860px){.rev{grid-template-columns:1fr}.rate .big{font-size:72px}}

/* контакты */
.cnt{display:grid;grid-template-columns:1fr 1.25fr;gap:12px}
.info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;display:flex;flex-direction:column;gap:26px}
.info dt{color:var(--mut);font-size:14px;margin-bottom:6px}
.info dd{font-size:18px;font-weight:500}
.info dd a{border-bottom:1px solid var(--line)}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:4px 20px}
.map{border-radius:var(--r);overflow:hidden;min-height:420px;background:var(--card);border:1px solid var(--line)}
.map iframe{width:100%;height:100%;min-height:420px;border:0;display:block}
@media(max-width:860px){.cnt{grid-template-columns:1fr}.map,.map iframe{min-height:320px}}

/* призыв */
.cta{background:var(--ac);color:var(--on-ac);border-radius:calc(var(--r) + 8px);padding:clamp(36px,6vw,80px);display:grid;gap:28px}
.cta h2{margin:0;font-size:clamp(30px,5.4vw,68px);max-width:14ch}
.cta .tel{font:700 clamp(26px,4.4vw,56px)/1 var(--f-head);letter-spacing:-.03em}
.cta .row{display:flex;flex-wrap:wrap;gap:12px}
.cta .btn{border-color:currentColor;color:inherit}
.cta .btn.inv{background:var(--on-ac);color:var(--ac);border-color:var(--on-ac)}

/* подвал */
.ftr{padding:56px 0 32px;border-top:1px solid var(--line);margin-top:clamp(64px,9vw,120px);font-size:15px}
.ftr .cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px}
.ftr .logo{display:block;margin-bottom:10px}
.ftr p{color:var(--mut)}
.ftr .bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:40px;color:var(--mut);font-size:13px}
@media(max-width:760px){.ftr .cols{grid-template-columns:1fr}}
.demo{background:var(--bg2);color:var(--mut);text-align:center;font-size:13px;padding:14px var(--gut)}

/* кнопки внизу на телефоне */
.dock{display:none}
@media(max-width:760px){
  .dock{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px var(--gut) calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .35s}
  .dock.on{transform:none}
  .dock .btn{height:50px;padding:0 12px}
  body{padding-bottom:76px}
}

/* лёгкое появление */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.bar i::after{transform:scaleX(1)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
const S = SITE, $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tel = "tel:" + S.phone.replace(/[^\d+]/g, "");
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; };
const y = S.yandex || {};
document.documentElement.dataset.theme = S.theme;

const has = { svc: S.services?.length, gal: S.photos?.length, rev: S.reviews?.length || S.praise?.length, cnt: S.address };
let hero = S.hero;
if ((hero === "A" || hero === "B") && !S.heroPhoto) hero = "C";

const acts = `<div class="acts">
  <a class="btn btn-ac" href="${tel}">Позвонить ${esc(S.phone)}</a>
  ${y.url ? `<a class="btn btn-gh" href="${esc(y.url)}" target="_blank" rel="noopener">Как проехать</a>` : ""}
</div>`;
const score = y.rating ? `<div class="score rv">
  <b>${esc(y.rating)}</b>
  <span>${y.marks ? `${y.marks} ${plural(y.marks,"оценка","оценки","оценок")}` : ""}${y.reviews ? ` · ${y.reviews} ${plural(y.reviews,"отзыв","отзыва","отзывов")}` : ""}<br>на Яндекс Картах</span>
</div>` : "";
const meta = `<div class="hero-meta">
  ${S.address ? `<span><b>${esc(S.address.replace(/^Минск,\s*/,""))}</b></span>` : ""}
  ${S.hours?.length ? `<span>${S.hours.map(h => esc(h.join(" "))).join(", ")}</span>` : ""}
</div>`;

let heroHTML;
if (hero === "B") {
  heroHTML = `<section class="hero B"><div class="wrap split">
    <div class="rv"><h1>${esc(S.title)}</h1><p class="lead">${esc(S.lead)}</p>${acts}${meta}</div>
    <div class="ph rv"><img src="${esc(S.heroPhoto)}" alt="${esc(S.name)} — ${esc(S.address)}" fetchpriority="high">${score}</div>
  </div></section>`;
} else {
  heroHTML = `<section class="hero ${hero}">
    ${hero === "A" ? `<img class="bgimg" src="${esc(S.heroPhoto)}" alt="${esc(S.name)} — ${esc(S.address)}" fetchpriority="high">` : ""}
    <div class="wrap hero-grid">
      <div class="rv"><h1>${esc(S.title)}</h1><p class="lead">${esc(S.lead)}</p>${acts}${meta}</div>
      ${score}
    </div>
    ${hero === "C" ? `<div class="mark" aria-hidden="true">${esc(S.name)}</div>` : ""}
  </section>`;
}

const nav = [has.svc && ["#uslugi","Услуги"], has.gal && ["#foto","Фото"], has.rev && ["#otzyvy","Отзывы"], has.cnt && ["#kontakty","Контакты"]].filter(Boolean);

const facts = S.facts?.length ? `<div class="wrap"><div class="facts rv">${S.facts.map(f => `<div>${esc(f)}</div>`).join("")}</div></div>` : "";

const anyPrice = S.services?.some(g => g.items.some(i => i[1]));
const svc = has.svc ? `<section id="uslugi"><div class="wrap">
  <h2 class="rv">Услуги${anyPrice ? " и цены" : ""}</h2>
  <div class="svc">${S.services.map((g, i) => `<article class="rv">
    <div class="n">${String(i + 1).padStart(2, "0")}</div><h3>${esc(g.title)}</h3>
    <ul>${g.items.map(it => `<li><span>${esc(it[0])}</span>${it[1] ? `<b>${esc(it[1])}</b>` : ""}</li>`).join("")}</ul>
  </article>`).join("")}</div>
  ${!anyPrice && S.pricesNote ? `<p class="svc-note rv">${esc(S.pricesNote)}</p>` : ""}
</div></section>` : "";

const gal = has.gal ? `<section id="foto"><div class="wrap"><h2 class="rv">Фото</h2>
  <div class="gal">${S.photos.map(p => `<figure class="rv"><img src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy" decoding="async"></figure>`).join("")}</div>
</div></section>` : "";

const rev = has.rev ? `<section id="otzyvy"><div class="wrap"><h2 class="rv">Отзывы</h2>
  <div class="rev">
    ${y.rating ? `<div class="rate rv">
      <div class="big">${esc(y.rating)}</div>
      <div class="sub">${y.marks ? `${y.marks} ${plural(y.marks,"оценка","оценки","оценок")} на Яндекс Картах` : "на Яндекс Картах"}</div>
      ${(S.praise || []).map(p => `<div class="bar"><div><span>${esc(p[0])}</span><span>${p[1]}%</span></div><i style="--w:${p[1]}%"></i></div>`).join("")}
      ${S.praise?.length ? `<p class="mut" style="font-size:13px;margin-top:14px">Доля положительных отзывов по темам</p>` : ""}
      ${y.url ? `<a href="${esc(y.url)}reviews/" target="_blank" rel="noopener">Все ${y.reviews ? y.reviews + " " + plural(y.reviews,"отзыв","отзыва","отзывов") : "отзывы"} на Яндекс Картах</a>` : ""}
    </div>` : ""}
    <div class="quotes">${(S.reviews || []).map(r => `<blockquote class="rv"><p>${esc(r.text)}</p><cite>${esc(r.name)}</cite></blockquote>`).join("")}</div>
  </div>
</div></section>` : "";

const cnt = has.cnt ? `<section id="kontakty"><div class="wrap"><h2 class="rv">Как нас найти</h2>
  <div class="cnt">
    <dl class="info rv">
      <div><dt>Адрес</dt><dd>${esc(S.address)}</dd></div>
      <div><dt>Телефон</dt><dd><a href="${tel}">${esc(S.phone)}</a></dd></div>
      ${S.hours?.length ? `<div><dt>Часы работы</dt><dd class="hrs">${S.hours.map(h => `<span>${esc(h[0])}</span><span>${esc(h[1])}</span>`).join("")}</dd></div>` : ""}
      ${S.route?.length ? `<div><dt>Как добраться</dt><dd>${S.route.map(esc).join("<br>")}</dd></div>` : ""}
      ${S.viber || S.telegram ? `<div><dt>Написать</dt><dd>${[S.viber && `<a href="viber://chat?number=${encodeURIComponent(S.viber)}">Viber</a>`, S.telegram && `<a href="https://t.me/${esc(S.telegram)}">Telegram</a>`].filter(Boolean).join(" · ")}</dd></div>` : ""}
    </dl>
    ${y.id ? `<div class="map rv"><iframe src="https://yandex.by/map-widget/v1/?oid=${esc(y.id)}&z=16" title="${esc(S.name)} на карте" loading="lazy"></iframe></div>` : ""}
  </div>
</div></section>` : "";

const cta = `<section><div class="wrap"><div class="cta rv">
  <h2>Записаться на ремонт</h2>
  <a class="tel" href="${tel}">${esc(S.phone)}</a>
  <div class="row"><a class="btn inv" href="${tel}">Позвонить</a>${y.url ? `<a class="btn" href="${esc(y.url)}" target="_blank" rel="noopener">Открыть на карте</a>` : ""}</div>
</div></div></section>`;

const L = S.legal || {};
const ftr = `<footer class="ftr"><div class="wrap">
  <div class="cols">
    <div><span class="logo">${esc(S.name)}</span><p>${esc(S.address)}</p></div>
    <div><p><a href="${tel}">${esc(S.phone)}</a></p>${S.hours?.length ? `<p>${S.hours.map(h => esc(h.join(" "))).join("<br>")}</p>` : ""}</div>
    <div>${nav.map(n => `<p><a href="${n[0]}">${n[1]}</a></p>`).join("")}</div>
  </div>
  <div class="bot">
    <span>${[L.company, L.unp && "УНП " + L.unp, L.regInfo].filter(Boolean).map(esc).join(" · ")}</span>
    ${y.rating ? `<span>Рейтинг и отзывы — Яндекс Карты</span>` : ""}
  </div>
</div></footer>
${S.demo ? `<div class="demo">Демо-версия сайта. Подготовлена бесплатно, удалим по первой просьбе.</div>` : ""}`;

const dock = `<div class="dock"><a class="btn btn-ac" href="${tel}">Позвонить</a>${y.url ? `<a class="btn btn-gh" href="${esc(y.url)}" target="_blank" rel="noopener">Маршрут</a>` : `<a class="btn btn-gh" href="#kontakty">Адрес</a>`}</div>`;

const hdr = `<header class="hdr"><div class="wrap">
  <a class="logo" href="#">${esc(S.name)}</a>
  <nav class="nav">${nav.map(n => `<a href="${n[0]}">${n[1]}</a>`).join("")}</nav>
  <a class="btn btn-ac" href="${tel}">Позвонить</a>
</div></header>`;

$("#app").outerHTML = hdr + `<main>${heroHTML}${facts}${svc}${gal}${rev}${cnt}${cta}</main>` + ftr + dock;

// разметка для поисковиков — только из данных выше
const ld = { "@context": "https://schema.org", "@type": "AutoRepair", name: S.name, telephone: S.phone,
  address: { "@type": "PostalAddress", streetAddress: S.address.replace(/^Минск,\s*/, ""), addressLocality: "Минск", addressCountry: "BY" },
  paymentAccepted: "Наличные, карта" };
if (S.heroPhoto) ld.image = S.heroPhoto;
if (y.url) ld.sameAs = [y.url];
if (y.rating && y.marks) ld.aggregateRating = { "@type": "AggregateRating", ratingValue: y.rating.replace(",", "."), ratingCount: y.marks, reviewCount: y.reviews || undefined, bestRating: 5 };
const s = document.createElement("script"); s.type = "application/ld+json"; s.textContent = JSON.stringify(ld); document.head.appendChild(s);

// шапка с фоном после прокрутки, кнопки внизу на телефоне
const h = $(".hdr"), d = $(".dock");
const onScroll = () => { const y = scrollY; h.classList.toggle("solid", y > 20); d.classList.toggle("on", y > innerHeight * .6); };
addEventListener("scroll", onScroll, { passive: true }); onScroll();

// плавное появление блоков
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
document.querySelectorAll(".rv").forEach(el => io.observe(el));
})();
</script>
</body>
</html>
