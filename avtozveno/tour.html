<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Тур по сайту — Автозвено</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
/* Тур: сам едет по блокам сайта, приближает и показывает плашки.
   Компьютер: tour.html   Телефон: tour.html?mobile
   Пауза/продолжить — пробел или клик по кнопке, заново — R, спрятать кнопки — H */
:root{--ac:#1E6BFF;--tx:#151513;--bg:#07080b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);font:400 16px/1.45 "Onest",system-ui,sans-serif;color:var(--tx)}
.screen{position:absolute;overflow:hidden;background:#0c0e13}
.zoom{position:absolute;inset:0;transform-origin:50% 50%;transition:transform 1.1s cubic-bezier(.45,0,.2,1)}
iframe{display:block;width:100%;height:100%;border:0;background:#0c0e13}
/* компьютер: сайт на весь экран */
body:not(.mob) .screen{inset:0}
/* телефон: рамка по центру */
.mob{background:radial-gradient(70% 60% at 50% 40%,#16203a,#07080b)}
.phone{position:absolute;left:50%;top:50%;width:414px;height:868px;border-radius:56px;background:#0b0b0a;box-shadow:0 0 0 2px #3a3a36,0 40px 90px rgba(0,0,0,.55);transform-origin:50% 50%}
.mob .screen{left:12px;top:12px;width:390px;height:844px;border-radius:44px}
/* плашка */
.cap{position:fixed;right:32px;bottom:32px;width:min(500px,calc(100% - 64px));background:#fff;border-radius:24px;padding:24px 26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.28);z-index:10;opacity:0;transform:translateY(24px) scale(.98);transition:opacity .5s,transform .6s cubic-bezier(.2,.7,.2,1)}
.cap.show{opacity:1;transform:none}
.cap .n{display:inline-block;background:var(--ac);color:#fff;border-radius:99px;padding:4px 12px;font-weight:600;font-size:13px}
.cap h2{font:700 24px/1.15 "Unbounded",system-ui,sans-serif;letter-spacing:-.02em;margin:14px 0 14px}
.cap p{font-size:16.5px;margin-top:8px}
.cap p b{font-weight:600}
.cap p.c{color:#55524a}
.mob .cap{right:auto;left:calc(50% + 250px);bottom:auto;top:50%;transform:translateY(calc(-50% + 24px));width:min(440px,calc(50% - 290px))}
.mob .cap.show{transform:translateY(-50%)}
@media(max-width:1100px){.mob .cap{left:50%;top:auto;bottom:24px;width:min(460px,calc(100% - 32px));transform:translate(-50%,24px)}.mob .cap.show{transform:translate(-50%,0)}}
@media(max-width:600px){.cap{right:auto;left:12px;bottom:12px;width:calc(100% - 24px);padding:18px 18px 16px}.cap h2{font-size:19px}.cap p{font-size:15px}.mob .cap{left:12px;transform:translateY(24px)}.mob .cap.show{transform:none}}
/* полоса прогресса и кнопки */
.bar{position:fixed;left:0;top:0;height:4px;background:var(--ac);z-index:11;width:0;transition:width .4s linear}
.ctl{position:fixed;right:20px;top:20px;display:flex;gap:8px;z-index:12;transition:opacity .3s}
.ctl button{height:40px;padding:0 16px;border-radius:99px;border:0;background:rgba(20,20,18,.78);color:#fff;font:600 14px "Onest",sans-serif;cursor:pointer;backdrop-filter:blur(8px)}
.ctl button.y{background:var(--ac);color:#fff}
.hide .ctl{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="bar"></div>
<div class="ctl"><button class="y" id="play" type="button">Пауза</button><button id="again" type="button">Заново</button><button id="other" type="button"></button><button id="hide" type="button">Скрыть кнопки</button></div>
<div id="stage"></div>
<div class="cap"><span class="n"></span><h2></h2><p class="o"><b>Вам:</b> <span></span></p><p class="c"><b>Клиентам:</b> <span></span></p></div>

<script>
/* ===== Шаги тура: блок сайта, что приблизить, тексты плашки (простым языком) ===== */
const STEPS = [
  { sec: "#top", focus: ".hero .grid>div:first-child", title: "Первый экран",
    owner: "Сразу понятно, чем вы сильны: кузовной ремонт и покраска после ДТП на Лукьяновича. Кнопка — позвонить вам в одно касание.",
    client: "За пару секунд видно главное: что делаете, часы работы и рейтинг 4,9." },
  { sec: "#do-posle", focus: ".ba-grid", title: "До и после",
    owner: "Ваши лучшие работы. Лучше любых слов показывают, как вы восстанавливаете машины.",
    client: "Двигают ползунок и сами видят: была разбитая машина — стала как новая." },
  { sec: "#strahovye", focus: ".ins", title: "Работа со страховыми",
    owner: "После ДТП люди боятся бумажной волокиты. Здесь видно: ОСАГО, заказ-наряды, документы, фотоотчёт.",
    client: "Понимают, что со страховой помогут и всё будет официально." },
  { sec: "#uslugi", focus: ".svc", title: "Услуги",
    owner: "Все ваши работы на одном экране. Цен нет — кнопка «Узнать стоимость» сразу набирает ваш номер.",
    client: "Находят свою проблему — пороги, бампер, покраска — и звонят." },
  { sec: "#akcii", focus: ".promo", title: "Акции и гарантия",
    owner: "Ваши акции и гарантия 6 месяцев на самом видном месте.",
    client: "Бесплатная полировка фар и −50% на четвёртый элемент — повод выбрать вас." },
  { sec: "#otzyvy", focus: ".quotes", title: "Отзывы",
    owner: "Ваши настоящие отзывы с Яндекс Карт, с благодарностями Вадиму и Александру. Люди верят чужому опыту больше, чем рекламе.",
    client: "Читают живые истории: быстро, в цвет, помогли со страховой." },
  { sec: "#pochemu", focus: ".why", title: "Почему вы",
    owner: "Гарантия, оплата как удобно, запись заранее, любые машины — всё из вашей карточки на картах.",
    client: "Мелочи, из-за которых выбирают вас, а не соседний сервис." },
  { sec: "#zapis", focus: ".steps", title: "Как записаться",
    owner: "Три простых шага. Даже тот, кто едет впервые, понимает, что делать.",
    client: "Позвонить, договориться о времени, приехать." },
  { sec: "#kontakty", focus: ".info", title: "Адрес и карта",
    owner: "Оба номера, адрес и карта. Меньше звонков с вопросом «как к вам проехать».",
    client: "Адрес, часы и маршрут в одном месте." },
  { sec: "#top", focus: null, title: "Сайт готов",
    owner: "Тексты, фото и акции поменяем, как скажете. Сайт удобно открывается и на телефоне.",
    client: "Открывают сайт по ссылке с карт и сразу видят работы, отзывы и акции." }
];
const HOLD = 7200;   // сколько стоит каждый шаг, мс

const mob = new URLSearchParams(location.search).has("mobile");
document.body.classList.toggle("mob", mob);
const stage = document.getElementById("stage");
stage.innerHTML = mob
  ? `<div class="phone"><div class="screen"><div class="zoom"><iframe src="index.html" title="Сайт"></iframe></div></div></div>`
  : `<div class="screen"><div class="zoom"><iframe src="index.html" title="Сайт"></iframe></div></div>`;
const frame = stage.querySelector("iframe"), zoom = stage.querySelector(".zoom"), phone = stage.querySelector(".phone");
const cap = document.querySelector(".cap"), bar = document.querySelector(".bar");
document.getElementById("other").textContent = mob ? "Версия для компьютера" : "Версия для телефона";
document.getElementById("other").onclick = () => location.search = mob ? "" : "?mobile";

function fitPhone(){ if (!phone) return;
  const s = Math.min(1, (innerHeight - 40) / 868, (innerWidth - 24) / 414);
  phone.style.transform = `translate(-50%,-50%) scale(${s})`;
  if (innerWidth < 600) phone.style.transform = `translate(-50%,-50%) scale(${Math.min((innerHeight - 20) / 868, (innerWidth - 8) / 414)})`;
}
addEventListener("resize", fitPhone); fitPhone();

const sleep = ms => new Promise(r => setTimeout(r, ms));
let i = 0, paused = false, run = 0;

function scrollFrame(to, ms){ const w = frame.contentWindow, from = w.scrollY, t0 = performance.now();
  w.document.documentElement.style.scrollBehavior = "auto";
  return new Promise(res => { const k = now => { const p = Math.min(1, (now - t0) / ms), e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
    w.scrollTo(0, from + (to - from) * e); p < 1 ? requestAnimationFrame(k) : res(); }; requestAnimationFrame(k); }); }

function zoomTo(el, scale){
  if (!el) { zoom.style.transform = "none"; return; }
  const r = el.getBoundingClientRect(), vw = frame.clientWidth, vh = frame.clientHeight;
  const cx = Math.max(0, Math.min(vw, r.left + r.width / 2)), cy = Math.max(0, Math.min(vh, r.top + Math.min(r.height, vh) / 2));
  const s = Math.min(scale, vw * .92 / r.width, vh * .9 / Math.min(r.height, vh)); // не приближать больше, чем влезает
  zoom.style.transformOrigin = `${cx}px ${cy}px`; zoom.style.transform = `scale(${Math.max(1.04, s)})`;
}

async function show(n, my){
  const st = STEPS[n], d = frame.contentDocument, w = frame.contentWindow;
  cap.classList.remove("show"); zoomTo(null);
  bar.style.width = ((n + 1) / STEPS.length * 100) + "%";
  const sec = d.querySelector(st.sec);
  sec.querySelectorAll(".rv").forEach(e => e.classList.add("in"));
  const top = st.sec === "#top" ? 0 : sec.getBoundingClientRect().top + w.scrollY - (mob ? 64 : 80);
  await sleep(500); if (my !== run) return;
  await scrollFrame(Math.max(0, top), 1400); if (my !== run) return;
  cap.querySelector(".n").textContent = n === STEPS.length - 1 ? "Итог" : `Блок ${n + 1} из ${STEPS.length - 1}`;
  cap.querySelector("h2").textContent = st.title;
  cap.querySelector(".o span").textContent = st.owner;
  cap.querySelector(".c span").textContent = st.client;
  await sleep(200); cap.classList.add("show");
  await sleep(500); if (my !== run) return;
  if (st.focus) zoomTo(d.querySelector(st.focus), mob ? 1.12 : (n ? 1.3 : 1.15));
}

async function loop(){
  const my = ++run;
  while (my === run) {
    while (paused) { await sleep(200); if (my !== run) return; }
    await show(i, my); if (my !== run) return;
    let t = 0; while (t < HOLD) { await sleep(100); if (my !== run) return; if (!paused) t += 100; }
    if (i === STEPS.length - 1) { paused = true; document.getElementById("play").textContent = "Продолжить"; }
    i = (i + 1) % STEPS.length;
  }
}

const play = document.getElementById("play");
const toggle = () => { paused = !paused; play.textContent = paused ? "Продолжить" : "Пауза"; };
play.onclick = toggle;
document.getElementById("again").onclick = () => { i = 0; paused = false; play.textContent = "Пауза"; loop(); };
document.getElementById("hide").onclick = () => document.body.classList.add("hide");
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.key === "r" || e.key === "к") document.getElementById("again").click();
  if (e.key === "h" || e.key === "р") document.body.classList.toggle("hide"); });

frame.addEventListener("load", () => {
  const d = frame.contentDocument;
  for (let k = STEPS.length - 1; k >= 0; k--) { const e = d.querySelector(STEPS[k].sec); if (!e || e.hidden) STEPS.splice(k, 1); }
  // в туре прячем полосы прокрутки и не даём карте «перехватывать» мышь
  const st = d.createElement("style"); st.textContent = "html{scrollbar-width:none}html::-webkit-scrollbar{display:none}"; d.head.appendChild(st);
  setTimeout(loop, 1200);
});
</script>
</body>
</html>
